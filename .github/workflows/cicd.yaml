name: Lib Components CICD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  CICD:
    # TEMPORARY (MAIR-316 / MAIR-320): RGAA engine of the CICD branch under review, to test the
    # accessibility job and its AI pre-audit on this PR. Set back to the CICD release before merging.
    uses: mairie360/CICD/.github/workflows/front-libs-cicd.yml@mair-320-rgaa-ai-preaudit
    with:
      cicd_version: mair-320-rgaa-ai-preaudit
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
