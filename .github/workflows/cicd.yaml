name: Lib Components CICD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  CICD:
    # [NOUVEAU] MAIR-493 : TEMPORAIRE, test de mairie360/CICD#142 + #162 (audit de production seul). Repasser `uses` et `cicd_version` sur le tag publie avant merge.
    uses: mairie360/CICD/.github/workflows/front-libs-cicd.yml@161-front-lib-audit-production-only
    with:
      cicd_version: 161-front-lib-audit-production-only
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
