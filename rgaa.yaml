    story: components-badge-badge--default
  - id: badge-badge--green
    story: components-badge-badge--green
  - id: badge-badge--blue
    story: components-badge-badge--blue
  - id: badge-badge--red
    story: components-badge-badge--red
  - id: badge-badge--dark
    story: components-badge-badge--dark
  - id: badge-badge--rounded
    story: components-badge-badge--rounded
  # Components/Buttons/Button
  - id: buttons-button--default
    story: components-buttons-button--default
  # Components/Calendar/Composition
  - id: calendar-composition--month
    story: components-calendar-composition--month
