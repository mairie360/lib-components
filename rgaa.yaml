  - id: input-inputmanager--date-input
    story: components-input-inputmanager--date-input
  - id: input-inputmanager--checkbox
    story: components-input-inputmanager--checkbox
  - id: input-inputmanager--number-input
    story: components-input-inputmanager--number-input
  - id: input-inputmanager--password-input
    story: components-input-inputmanager--password-input
  - id: input-inputmanager--email-input
    story: components-input-inputmanager--email-input
  - id: input-inputmanager--telephone-input
    story: components-input-inputmanager--telephone-input
  - id: input-inputmanager--search-input
