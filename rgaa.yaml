  - id: select-select--open
    description: Listbox opened
    story: components-select-select--default
    steps:
      # No role="listbox" on the opened list yet (MAIR-473): wait for its first option.
      - click: { role: button, name: Sélectionner une option }
      - wait_for: { text: Option 1, exact: true }
